<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Barba Poker Room</title>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080c08; --felt:#0d5c30; --rail:#1a1a1a;
  --green:#00c853; --green-bright:#00e676;
  --gold:#ffd700; --red:#d32f2f;
  --text:#e8f5e9; --text-dim:#81c784;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text);
     min-height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── LOBBY ── */
#lobby{display:flex;flex-direction:column;align-items:center;justify-content:center;
       height:100vh;gap:20px}
#lobby h1{font-family:'Bebas Neue';font-size:48px;letter-spacing:6px;
          color:var(--green-bright);text-shadow:0 0 20px #00e67660}
#lobby input{background:#1a2e1a;border:1px solid #2a4a2a;color:var(--text);
             padding:12px 18px;border-radius:8px;font-family:'Rajdhani';
             font-size:16px;font-weight:600;width:260px;outline:none}
#lobby input:focus{border-color:var(--green-bright)}
.lobby-btn{background:linear-gradient(180deg,#1e5e1e,#0d3d10);border:1px solid var(--green);
           color:var(--green-bright);padding:12px 28px;border-radius:8px;
           font-family:'Bebas Neue';font-size:20px;letter-spacing:2px;cursor:pointer;
           transition:all .15s;width:260px}
.lobby-btn:hover{background:linear-gradient(180deg,#2a7a2a,#1a5a1a)}
.lobby-sep{color:#2a4a2a;font-size:13px;letter-spacing:2px}
#code-input-wrap{display:flex;gap:8px}
#code-input-wrap input{width:140px}
#code-input-wrap button{flex:1;width:auto}

/* ── TOP BAR ── */
#topbar{display:flex;align-items:center;justify-content:space-between;
        padding:8px 16px;background:#050805;border-bottom:1px solid #1a2e1a;flex-shrink:0}
#topbar-title{font-family:'Bebas Neue';font-size:20px;letter-spacing:3px;
              color:var(--green-bright);text-shadow:0 0 12px #00e67660}
#topbar-info{font-size:12px;color:var(--text-dim);font-weight:600;text-align:center}
#topbar-info span{color:var(--gold)}
#room-code-badge{background:#1a2e1a;border:1px solid #2a4a2a;color:var(--green-bright);
                 padding:4px 12px;border-radius:6px;font-family:'Bebas Neue';
                 font-size:16px;letter-spacing:2px;cursor:pointer}
#room-code-badge:hover{background:#2a4a2a}

/* ── GAME AREA ── */
#game{display:none;flex:1;flex-direction:column;overflow:hidden}

/* TABLE */
#game-area{flex:1;display:flex;align-items:center;justify-content:center;padding:8px}
.table-wrap{position:relative;width:min(94vw,420px);aspect-ratio:.62}
.table-bg{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,#175c35 0%,#0d4a26 50%,#073d1f 100%);
  box-shadow:0 0 0 8px #111,0 0 0 14px #1e3a1e,0 0 0 18px #0a140a,
             0 0 40px #00c85330 inset,0 8px 60px #000a}
.table-logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            font-family:'Bebas Neue';font-size:22px;letter-spacing:6px;
            color:#ffffff0d;pointer-events:none}

/* CENTER INFO */
.center-info{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
             text-align:center;pointer-events:none;z-index:5}
.pot-label{font-size:10px;color:var(--text-dim);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.pot-amount{font-family:'Bebas Neue';font-size:26px;color:var(--gold);
            text-shadow:0 0 12px #ffd70080;line-height:1}

/* COMMUNITY CARDS */
.community-cards{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
                 display:flex;gap:5px;z-index:6}

/* CARDS */
.card{width:32px;height:46px;border-radius:5px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;font-weight:700;font-size:13px;
      line-height:1;position:relative;box-shadow:0 2px 8px #0008}
.card.face-up{background:#fff;color:#1a1a1a}
.card.face-up.red{color:#c62828}
.card.face-down{background:linear-gradient(135deg,#0d3d1f,#1a6b3c);border:1px solid #2a8a4a}
.card-rank{font-size:14px;font-family:'Bebas Neue'}
.card-suit{font-size:12px;line-height:1}
.card-slot{background:#ffffff08;border:1px dashed #ffffff15;width:32px;height:46px;border-radius:5px}

/* PLAYERS */
.player{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:8}
.player.active .player-avatar{box-shadow:0 0 0 3px var(--green-bright),0 0 16px #00e67680}
.player.folded{opacity:.35}
.player.winner .player-avatar{animation:winnerPulse 1s ease infinite}
@keyframes winnerPulse{0%,100%{box-shadow:0 0 0 3px var(--gold),0 0 20px #ffd70080}
                        50%{box-shadow:0 0 0 5px var(--gold),0 0 30px #ffd700c0}}
.player.me .player-avatar{border-color:var(--green-bright)!important}
.player-avatar{width:46px;height:46px;border-radius:50%;background:#1a2e1a;
               border:2px solid #2a4a2a;display:flex;align-items:center;
               justify-content:center;font-size:20px;box-shadow:0 2px 10px #0008}
.dealer-btn{position:absolute;bottom:-2px;right:-2px;width:15px;height:15px;
            border-radius:50%;background:var(--gold);color:#000;font-size:7px;
            font-weight:700;display:flex;align-items:center;justify-content:center;
            border:1px solid #fff;z-index:2}
.player-name{font-size:11px;font-weight:700;color:#fff;background:#000000bb;
             padding:1px 7px;border-radius:10px;white-space:nowrap;max-width:76px;
             overflow:hidden;text-overflow:ellipsis}
.player-stack{font-size:11px;font-weight:700;color:var(--gold);background:#000000bb;
              padding:1px 7px;border-radius:10px}
.player-cards{display:flex;gap:2px}
.player-cards .card{width:20px;height:28px;font-size:8px}
.player-cards .card-rank{font-size:9px}
.player-cards .card-suit{font-size:7px}
.player-bet{position:absolute;font-size:10px;font-weight:700;color:#fff;
            background:#000000cc;padding:1px 5px;border-radius:7px;
            white-space:nowrap;display:flex;align-items:center;gap:2px}
.bet-chip{width:10px;height:10px;border-radius:50%;
          background:radial-gradient(circle at 35% 35%,#ef5350,#b71c1c);border:1px solid #fff4}
.offline-badge{position:absolute;top:-4px;right:-4px;background:#555;
               border-radius:50%;width:12px;height:12px;font-size:7px;
               display:flex;align-items:center;justify-content:center}

/* Positions */
.p0{bottom:2%;left:50%;transform:translateX(-50%)}
.p1{bottom:18%;left:2%}
.p2{top:28%;left:0%}
.p3{top:5%;left:20%}
.p4{top:2%;left:50%;transform:translateX(-50%)}
.p5{top:5%;right:20%}
.p6{top:28%;right:0%}
.p7{bottom:18%;right:2%}
.p8{bottom:12%;right:8%}

/* Bet bubbles */
.p0 .player-bet{top:-26px;left:50%;transform:translateX(-50%)}
.p1 .player-bet{top:0;right:-58px}
.p2 .player-bet{top:0;right:-58px}
.p3 .player-bet{bottom:-26px;right:-10px}
.p4 .player-bet{bottom:-26px;left:50%;transform:translateX(-50%)}
.p5 .player-bet{bottom:-26px;left:-10px}
.p6 .player-bet{top:0;left:-58px}
.p7 .player-bet{top:0;left:-58px}
.p8 .player-bet{top:0;left:-58px}

/* STATUS MSG */
.status-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            background:#000000cc;border:1px solid var(--green);border-radius:12px;
            padding:12px 22px;text-align:center;z-index:20;pointer-events:none;
            backdrop-filter:blur(4px)}
.status-msg h2{font-family:'Bebas Neue';font-size:26px;color:var(--gold);letter-spacing:2px}
.status-msg p{font-size:13px;color:var(--text-dim);margin-top:3px}

/* WAITING PANEL */
.waiting-panel{position:absolute;inset:0;display:flex;flex-direction:column;
               align-items:center;justify-content:center;gap:12px;z-index:15}
.waiting-panel p{font-size:14px;color:var(--text-dim);font-weight:600}
.start-btn{background:linear-gradient(180deg,#1e5e1e,#0d3d10);border:1px solid var(--green);
           color:var(--green-bright);padding:12px 28px;border-radius:8px;
           font-family:'Bebas Neue';font-size:20px;letter-spacing:2px;cursor:pointer}
.start-btn:hover{background:linear-gradient(180deg,#2a7a2a,#1a5a1a)}
.start-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── ACTION AREA ── */
#action-area{flex-shrink:0;background:#050805;border-top:1px solid #1a2e1a;padding:8px 12px 10px}
.hero-hand{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.hero-hand .card{width:40px;height:58px;font-size:15px;border-radius:6px}
.hero-hand .card-rank{font-size:17px}
.hero-hand .card-suit{font-size:14px}
.action-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.action-btn{padding:10px 4px;border:none;border-radius:8px;
            font-family:'Bebas Neue';font-size:17px;letter-spacing:1.5px;cursor:pointer;transition:all .1s}
.action-btn:active{transform:scale(.96)}
.action-btn:disabled{opacity:.35;cursor:not-allowed}
.btn-fold{background:linear-gradient(180deg,#c62828,#8b0000);color:#fff}
.btn-check{background:linear-gradient(180deg,#1565c0,#0d47a1);color:#fff}
.btn-call{background:linear-gradient(180deg,#1565c0,#0d47a1);color:#fff}
.btn-raise{background:linear-gradient(180deg,#e65100,#bf360c);color:#fff}
.btn-sub{font-family:'Rajdhani';font-size:10px;letter-spacing:0;display:block;opacity:.85;margin-top:1px}
.raise-wrap{display:none;flex-direction:column;gap:4px;margin-top:6px}
.raise-row{display:flex;align-items:center;gap:8px}
.raise-row input[type=range]{flex:1;height:4px;accent-color:var(--green-bright)}
.raise-val{font-family:'Bebas Neue';font-size:15px;color:var(--gold);min-width:48px;text-align:right}
.raise-presets{display:flex;gap:6px;justify-content:center}
.preset-btn{background:#1a2e1a;border:1px solid #2a4a2a;color:var(--text-dim);
            font-family:'Rajdhani';font-weight:700;font-size:11px;padding:3px 8px;
            border-radius:5px;cursor:pointer;transition:all .15s}
.preset-btn:hover{background:#2a4a2a;color:var(--green-bright);border-color:var(--green-bright)}
.waiting-msg{text-align:center;color:#4a8a4a;font-size:12px;font-weight:600;padding:8px 0}

/* ── CHAT ── */
#chat-wrap{position:fixed;right:0;top:0;bottom:0;width:220px;
           background:#050a05;border-left:1px solid #1a2e1a;
           display:none;flex-direction:column;z-index:50}
#chat-wrap.open{display:flex}
#chat-header{padding:10px 12px;background:#0a120a;border-bottom:1px solid #1a2e1a;
             font-family:'Bebas Neue';font-size:16px;letter-spacing:2px;color:var(--green-bright)}
#chat-messages{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.chat-msg{font-size:11px;color:var(--text-dim)}
.chat-msg strong{color:var(--green-bright)}
#chat-input-row{display:flex;gap:4px;padding:6px}
#chat-input{flex:1;background:#1a2e1a;border:1px solid #2a4a2a;color:var(--text);
            padding:5px 8px;border-radius:5px;font-family:'Rajdhani';font-size:12px;outline:none}
#chat-send{background:#1a2e1a;border:1px solid #2a4a2a;color:var(--green-bright);
           padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12px}

/* CHAT TOGGLE BTN */
#chat-toggle{position:fixed;right:12px;top:50px;background:#1a2e1a;
             border:1px solid #2a4a2a;color:var(--text-dim);padding:6px 10px;
             border-radius:6px;cursor:pointer;z-index:51;font-size:18px}

/* LOG */
#game-log{position:absolute;bottom:50px;left:8px;font-size:9px;color:#4a8a4a;
          font-weight:600;line-height:1.6;pointer-events:none;z-index:7;max-width:110px}
</style>
</head>
<body>

<!-- ══ LOBBY ══════════════════════════════════════════════════ -->
<div id="lobby">
  <h1>🃏 LA BARBA</h1>
  <p style="color:var(--text-dim);font-size:13px;letter-spacing:2px">POKER ROOM</p>

  <input id="name-input" placeholder="Tu nombre" maxlength="16">

  <button class="lobby-btn" id="btn-create">Crear sala</button>
  <span class="lobby-sep">── o únete ──</span>
  <div id="code-input-wrap">
    <input id="join-code" placeholder="Código" maxlength="5" style="text-transform:uppercase">
    <button class="lobby-btn" id="btn-join" style="width:auto;padding:12px 16px">Entrar</button>
  </div>
  <p id="lobby-error" style="color:#ef5350;font-size:12px;min-height:16px"></p>
</div>

<!-- ══ GAME ════════════════════════════════════════════════════ -->
<div id="game">
  <!-- Top bar -->
  <div id="topbar">
    <div id="topbar-title">LA BARBA</div>
    <div id="topbar-info">
      <span id="stage-name">Esperando</span><br>
      Sala: <span id="room-code-display">----</span>
    </div>
    <div id="room-code-badge" title="Clic para copiar código">----</div>
  </div>

  <!-- Table -->
  <div id="game-area">
    <div class="table-wrap" id="table-wrap">
      <div class="table-bg"></div>
      <img src="/imgs/barbas_logo.png" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:350px;opacity:0.35;pointer-events:none;filter:invert(1) brightness(2);" />

      <div class="community-cards" id="community-cards"></div>

      <div class="center-info" id="center-info">
        <div class="pot-label">Pozo</div>
        <div class="pot-amount" id="pot-display">0</div>
      </div>

      <div class="status-msg" id="status-msg" style="display:none">
        <h2 id="status-title"></h2>
        <p id="status-sub"></p>
      </div>

      <div class="waiting-panel" id="waiting-panel">
        <p id="waiting-text">Esperando jugadores…</p>
        <button class="start-btn" id="btn-start-hand" disabled>Iniciar mano</button>
      </div>

      <div id="players-container"></div>
      <div id="game-log"></div>
    </div>
  </div>

  <!-- Action area -->
  <div id="action-area">
    <div class="hero-hand" id="hero-hand"></div>
    <div id="action-controls">
      <div class="action-buttons" id="action-buttons"></div>
      <div class="raise-wrap" id="raise-wrap">
        <div class="raise-row">
          <input type="range" id="raise-slider" min="20" max="1000" value="20">
          <div class="raise-val" id="raise-val">20</div>
        </div>
        <div class="raise-presets">
          <button class="preset-btn" data-preset="half">½ Pozo</button>
          <button class="preset-btn" data-preset="pot">Pot</button>
          <button class="preset-btn" data-preset="2x">2BB</button>
          <button class="preset-btn" data-preset="3x">3BB</button>
        </div>
      </div>
    </div>
    <div class="waiting-msg" id="waiting-msg" style="display:none">Esperando tu turno…</div>
  </div>
</div>

<!-- ══ CHAT ════════════════════════════════════════════════════ -->
<button id="chat-toggle">💬</button>
<div id="chat-wrap">
  <div id="chat-header">CHAT</div>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <input id="chat-input" placeholder="Mensaje…" maxlength="120">
    <button id="chat-send">▶</button>
  </div>
</div>

<script>
// ══ SOCKET ════════════════════════════════════════════════════
const socket = io();
let myId       = null;
let myName     = '';
let roomCode   = null;
let gameState  = null;
let raisingOn  = false;
let bigBlind   = 10;

socket.on('connect', () => { myId = socket.id; });

// ══ LOBBY ═════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const lobbyError = msg => { $('lobby-error').textContent = msg; };

$('btn-create').onclick = () => {
  const name = $('name-input').value.trim();
  if (!name) return lobbyError('Escribe tu nombre');
  socket.emit('room:create', { name, config:{ smallBlind:5, bigBlind:10, startStack:1000 } }, res => {
    if (!res.ok) return lobbyError(res.reason);
    myName = name; roomCode = res.code;
    enterGame();
  });
};

$('btn-join').onclick = () => {
  const name = $('name-input').value.trim();
  const code = $('join-code').value.trim().toUpperCase();
  if (!name) return lobbyError('Escribe tu nombre');
  if (!code) return lobbyError('Escribe el código de sala');
  socket.emit('room:join', { name, code }, res => {
    if (!res.ok) return lobbyError(res.reason);
    myName = name; roomCode = code;
    enterGame();
  });
};

function enterGame() {
  $('lobby').style.display = 'none';
  $('game').style.display  = 'flex';
  $('room-code-display').textContent = roomCode;
  $('room-code-badge').textContent   = roomCode;
}

$('room-code-badge').onclick = () => {
  navigator.clipboard?.writeText(roomCode);
  $('room-code-badge').textContent = '¡Copiado!';
  setTimeout(() => $('room-code-badge').textContent = roomCode, 1500);
};

// ══ GAME STATE ════════════════════════════════════════════════
socket.on('room:state', state => {
  gameState = state;
  bigBlind  = 10; // podría venir del state en futuro
  render(state);
});

socket.on('game:yourTurn', ({ playerId }) => {
  if (playerId === myId) {
    // pequeña vibración / highlight ya lo hace render()
  }
});

socket.on('game:handOver', ({ winnerId, handName, won }) => {
  showStatus(winnerId === myId ? '🏆 ¡GANASTE!' : `${gameState?.players.find(p=>p.id===winnerId)?.name||'?'} gana`, handName || '');
  setTimeout(() => $('status-msg').style.display = 'none', 3500);
});

// ══ RENDER ════════════════════════════════════════════════════
const POSITIONS = ['p0','p1','p2','p3','p4','p5','p6','p7','p8'];
const EMOJIS    = ['🦈','🎭','🤠','🧠','🦁','👾','🎯','⚡','🃏'];

function render(st) {
  // Stage name
  const stageNames = { waiting:'Esperando',pre:'Pre-Flop',flop:'Flop',turn:'Turn',river:'River',showdown:'Showdown' };
  $('stage-name').textContent = stageNames[st.stage] || st.stage;

  // Pot
  $('pot-display').textContent = st.pot;

  // Waiting panel
  const isWaiting = st.stage === 'waiting' || st.stage === 'showdown';
  $('waiting-panel').style.display = isWaiting ? 'flex' : 'none';
  if (isWaiting) {
    $('waiting-text').textContent = st.players.length < 2
      ? `Esperando jugadores… (${st.players.length}/9)`
      : st.stage === 'showdown' ? '¡Mano terminada!' : `Jugadores: ${st.players.length} — ¡Listos!`;
    $('btn-start-hand').disabled = st.players.length < 2;
  }

  // Community cards
  renderCommunity(st.community);

  // Players
  renderPlayers(st);

  // Hero hand + actions
  const me = st.players.find(p => p.id === myId);
  if (me) {
    renderHeroHand(me.cards);
    renderActions(st, me);
  }

  // Log
  const log = $('game-log');
  log.innerHTML = (st.log||[]).slice(-4).map(l => `<div style="opacity:.8">${l.msg}</div>`).join('');
}

function renderCommunity(cards) {
  const cc = $('community-cards');
  cc.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const c = cards[i];
    if (c) {
      const d = document.createElement('div');
      d.className = `card face-up${isRed(c) ? ' red' : ''}`;
      d.innerHTML = `<div class="card-rank">${c.r}</div><div class="card-suit">${c.s}</div>`;
      cc.appendChild(d);
    } else {
      const d = document.createElement('div');
      d.className = 'card-slot';
      cc.appendChild(d);
    }
  }
}

function renderPlayers(st) {
  const container = $('players-container');
  container.innerHTML = '';
  // Find my seat index for positioning (I'm always at p0)
  const meIdx = st.players.findIndex(p => p.id === myId);
  const total  = st.players.length;

  st.players.forEach((p, i) => {
    // Rotate seats so I'm always at bottom (p0)
    const rotated = (i - meIdx + total) % total;
    const posClass = POSITIONS[rotated] || `p${rotated}`;

    const div = document.createElement('div');
    div.className = [
      'player', posClass,
      p.id === st.activePlayerId && !['waiting','showdown'].includes(st.stage) ? 'active' : '',
      p.folded ? 'folded' : '',
      p.id === myId ? 'me' : ''
    ].filter(Boolean).join(' ');

    // Bet bubble
    const betHtml = p.bet > 0
      ? `<div class="player-bet"><div class="bet-chip"></div>${p.bet}</div>`
      : '';

    // Cards
    let cardsHtml = '<div class="player-cards">';
    if (!p.folded) {
      for (const c of p.cards) {
        if (!c) cardsHtml += `<div class="card face-down"></div>`;
        else cardsHtml += `<div class="card face-up${isRed(c)?' red':''}"><div class="card-rank">${c.r}</div><div class="card-suit">${c.s}</div></div>`;
      }
    }
    cardsHtml += '</div>';

    // Dealer button
    const dealerHtml = p.isDealer ? '<div class="dealer-btn">D</div>' : '';

    // Offline badge
    const offlineHtml = !p.connected ? '<div class="offline-badge">✕</div>' : '';

    const emoji = EMOJIS[i % EMOJIS.length];
    div.innerHTML = `
      ${betHtml}
      ${cardsHtml}
      <div class="player-avatar" style="position:relative">
        ${emoji}${dealerHtml}${offlineHtml}
      </div>
      <div class="player-name">${p.name}</div>
      <div class="player-stack">${p.stack}</div>
    `;
    container.appendChild(div);
  });
}

function renderHeroHand(cards) {
  const hh = $('hero-hand');
  hh.innerHTML = '';
  if (!cards || cards.length === 0) return;
  cards.forEach(c => {
    if (!c) {
      const d = document.createElement('div');
      d.className = 'card face-down';
      hh.appendChild(d);
    } else {
      const d = document.createElement('div');
      d.className = `card face-up${isRed(c) ? ' red' : ''}`;
      d.innerHTML = `<div class="card-rank">${c.r}</div><div class="card-suit">${c.s}</div>`;
      hh.appendChild(d);
    }
  });
}

function renderActions(st, me) {
  const ab  = $('action-buttons');
  const rwp = $('raise-wrap');
  const wm  = $('waiting-msg');
  const isMyTurn = st.activePlayerId === myId && !['waiting','showdown'].includes(st.stage);

  if (st.stage === 'showdown' || st.stage === 'waiting') {
    ab.innerHTML = ''; rwp.style.display='none'; wm.style.display='none';
    return;
  }
  if (!isMyTurn) {
    ab.innerHTML = ''; rwp.style.display='none'; wm.style.display='block';
    return;
  }
  wm.style.display = 'none';
  const toCall  = st.currentBet - me.bet;
  const canCheck= toCall <= 0;

  ab.innerHTML = `
    <button class="action-btn btn-fold" onclick="doAction('fold')">Fold</button>
    ${canCheck
      ? `<button class="action-btn btn-check" onclick="doAction('check')">Check</button>`
      : `<button class="action-btn btn-call" onclick="doAction('call')">Call<span class="btn-sub">${toCall}</span></button>`}
    ${raisingOn
      ? `<button class="action-btn btn-raise" style="background:linear-gradient(180deg,#6a1b9a,#4a148c);color:var(--gold)" onclick="confirmRaise()">¡Raise!<span class="btn-sub" id="raise-confirm-val">${$('raise-val').textContent}</span></button>`
      : `<button class="action-btn btn-raise" onclick="toggleRaise(true)">Raise</button>`}
  `;

  if (raisingOn) {
    rwp.style.display = 'flex';
    const sl = $('raise-slider');
    sl.min   = Math.max(st.currentBet * 2, bigBlind * 2);
    sl.max   = me.stack + me.bet;
    if (+sl.value < +sl.min) sl.value = sl.min;
    $('raise-val').textContent = sl.value;
  } else {
    rwp.style.display = 'none';
  }
}

// ══ ACTIONS ═══════════════════════════════════════════════════
function doAction(action) {
  socket.emit('game:action', { action }, res => {
    if (!res.ok) alert(res.reason);
    raisingOn = false;
  });
}

function toggleRaise(on) {
  raisingOn = on;
  if (gameState) renderActions(gameState, gameState.players.find(p=>p.id===myId));
}

function confirmRaise() {
  const amount = parseInt($('raise-slider').value);
  socket.emit('game:action', { action:'raise', amount }, res => {
    if (!res.ok) alert(res.reason);
    raisingOn = false;
  });
}

$('raise-slider').addEventListener('input', e => {
  $('raise-val').textContent = e.target.value;
  const rc = $('raise-confirm-val');
  if (rc) rc.textContent = e.target.value;
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.onclick = () => {
    if (!gameState) return;
    const pot = gameState.pot;
    const presets = { half: pot/2|0, pot, '2x': bigBlind*2, '3x': bigBlind*3 };
    const v = presets[btn.dataset.preset] || bigBlind*2;
    $('raise-slider').value = Math.max(v, gameState.currentBet*2);
    $('raise-slider').dispatchEvent(new Event('input'));
  };
});

$('btn-start-hand').onclick = () => {
  socket.emit('game:startHand', res => {
    if (res && !res.ok) alert(res.reason);
  });
};

// ══ STATUS MSG ════════════════════════════════════════════════
function showStatus(title, sub) {
  $('status-title').textContent = title;
  $('status-sub').textContent   = sub;
  $('status-msg').style.display = 'block';
}

// ══ CHAT ══════════════════════════════════════════════════════
$('chat-toggle').onclick = () => $('chat-wrap').classList.toggle('open');

function sendChat() {
  const t = $('chat-input').value.trim();
  if (!t) return;
  socket.emit('chat:message', t);
  $('chat-input').value = '';
}
$('chat-send').onclick = sendChat;
$('chat-input').onkeydown = e => e.key==='Enter' && sendChat();

socket.on('chat:message', ({ from, text }) => {
  const msgs = $('chat-messages');
  const d = document.createElement('div');
  d.className = 'chat-msg';
  d.innerHTML = `<strong>${from}:</strong> ${text}`;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
});

// ══ UTILS ═════════════════════════════════════════════════════
function isRed(card) { return card && ['♥','♦'].includes(card.s); }
</script>
